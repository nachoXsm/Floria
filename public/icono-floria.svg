<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 56 56">
  <!-- Fondo verde oscuro redondeado -->
  <rect width="56" height="56" rx="14" fill="#1E3D2B"/>
  <!-- Círculo casi completo, color crema -->
  <path d="M 46,15 A 22,22 0 1,1 42,11" stroke="#EDE8DE" stroke-width="2.2" stroke-linecap="round" fill="none"/>
  <!-- Tallo -->
  <line x1="27" y1="35" x2="27" y2="44" stroke="#EDE8DE" stroke-width="2" stroke-linecap="round"/>
  <!-- Hoja izquierda verde -->
  <path d="M 27,35 C 22,28 11,29 10,37 C 10,44 22,42 27,35 Z" fill="#7BBF8A"/>
  <!-- Hoja central verde claro con nervio -->
  <path d="M 27,35 C 32,24 28,12 22,9 C 16,12 18,24 27,35 Z" fill="#A8D4B0"/>
  <path d="M 27,35 C 25,24 23,14 22,9" stroke="rgba(255,255,255,0.25)" stroke-width="0.8" stroke-linecap="round" fill="none"/>
  <!-- Pétalo rosa -->
  <path d="M 27,35 C 25,27 34,16 40,19 C 44,24 37,33 27,35 Z" fill="#F0C4B8"/>
</svg>
